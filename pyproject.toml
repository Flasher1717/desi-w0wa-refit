[project]
name = "desi-w0wa-refit"
version = "0.1.0"
description = "Pre-registered independent reproduction of the w0waCDM preference in DESI DR2 BAO + compressed CMB + SNe, with a pre-registered low-z sensitivity profile"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Téo Alletz", email = "teo.alletz@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    "emcee>=3.1",
    "corner>=2.2",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "scipy-stubs>=1.17.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desi_w0wa_refit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "RET",       # return
    "ARG",       # unused arguments
    "PTH",       # use pathlib
    "T20",       # no print statements
    "RUF",       # ruff-specific
    "NPY",       # numpy
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]  # CLI scripts report progress to stdout

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_data: external-anchor tests, auto-skipped when data/ is absent",
]
